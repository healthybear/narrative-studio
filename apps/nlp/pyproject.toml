[project]
name = "narrative-studio-nlp"
version = "0.0.0"
description = "NLP analysis service for Narrative Studio"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
